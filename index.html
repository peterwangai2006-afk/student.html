
<!DOCTYPE html>
<html>
<head>
    <title>Student Registration System</title>
    <style>
        body {
            font-family: Arial;
            background: #eaf0f8;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        input {
            width: 95%;
            padding: 12px;
            margin: 8px 0 15px;
        }

        button {
            background: blue;
            color: white;
            padding: 12px;
            border: none;
            cursor: pointer;
        }

        a {
            color: blue;
        }
    </style>
</head>

<body>

<div class="container">

<h2>STUDENT REGISTRATION</h2>

<form id="studentForm">

<label>Student Name</label>
<input id="name" required>

<label>Admission Number</label>
<input id="admission" required>

<label>Name of School</label>
<input id="school" required>

<label>Class</label>
<input id="class" required>

<button type="submit">Register Student</button>

</form>

<div id="result"></div>

</div>

<script>

document.getElementById("studentForm")
.addEventListener("submit", function(e) {

    e.preventDefault();

    let student = {
        name: document.getElementById("name").value,
        admission: document.getElementById("admission").value,
        school: document.getElementById("school").value,
        studentClass: document.getElementById("class").value
    };

    localStorage.setItem(
        "student_" + student.admission,
        JSON.stringify(student)
    );

    let link = location.href.split("?")[0] +
        "?student=" + encodeURIComponent(student.admission);

    document.getElementById("result").innerHTML =
        "<h3>Student Registered Successfully!</h3>" +
        "<p>Student Link:</p>" +
        '<a href="' + link + '" target="_blank">' +
        link + '</a>';

});

let admission = new URLSearchParams(
    location.search
).get("student");

if (admission) {

    let data = localStorage.getItem("student_" + admission);

    if (data) {

        let student = JSON.parse(data);

        document.querySelector(".container").innerHTML =
            "<h2>STUDENT DETAILS</h2>" +
            "<p><b>Student Name:</b> " + student.name + "</p>" +
            "<p><b>Admission:</b> " + student.admission + "</p>" +
            "<p><b>School:</b> " + student.school + "</p>" +
            "<p><b>Class:</b> " + student.studentClass + "</p>";

    } else {
        document.querySelector(".container").innerHTML =
            "Student not found.";
    }
}

</script>

</body>
</html>
